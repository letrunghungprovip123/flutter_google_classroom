
services:
  # ==========================
  # 🐘 PostgreSQL Database
  # ==========================
  postgres:
    image: postgres:15
    container_name: postgres_db
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: flutter
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: nestdb
    volumes:
      - flutterbackend_pgdata:/var/lib/postgresql/data
    networks:
      - backend_net


  # ==========================
  # 🐇 RabbitMQ Message Broker
  # ==========================
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: flutter
      RABBITMQ_DEFAULT_PASS: 1234
    networks:
      - backend_net

  # ==========================
  # 🌐 API Gateway
  # ==========================
  api_gateway:
    build: ./FlutterBackEnd/api_gateway
    container_name: api_gateway
    restart: always
    depends_on:
      - rabbitmq
      - user_service
      - assignment_service
      - notification_service
    env_file:
      - ./FlutterBackEnd/api_gateway/.env
    ports:
      - "3000:3000"
    environment:
      RABBITMQ_URL: amqp://flutter:1234@rabbitmq:5672
      JWT_SECRET: hungprovip
    networks:
      - backend_net

  # ==========================
  # 👤 USER SERVICE
  # ==========================
  user_service:
    build: ./FlutterBackEnd/service/user-service
    container_name: user_service
    restart: always
    depends_on:
      - postgres
      - rabbitmq
    env_file:
      - ./FlutterBackEnd/service/user-service/.env
    environment:
      DATABASE_URL: postgresql://flutter:1234@postgres:5432/nestdb
      RABBITMQ_URL: amqp://flutter:1234@rabbitmq:5672
      JWT_SECRET: hungprovip
    networks:
      - backend_net

  # ==========================
  # 📝 ASSIGNMENT + QUIZ SERVICE
  # ==========================
  assignment_service:
    build: ./FlutterBackEnd/service/assignment-quiz-service
    container_name: assignment_service
    restart: always
    depends_on:
      - postgres
      - rabbitmq
    env_file:
      - ./FlutterBackEnd/service/assignment-quiz-service/.env
    environment:
      DATABASE_URL: postgresql://flutter:1234@postgres:5432/nestdb
      RABBITMQ_URL: amqp://flutter:1234@rabbitmq:5672
      JWT_SECRET: hungprovip
    networks:
      - backend_net

  # ==========================
  # 🔔 NOTIFICATION SERVICE
  # ==========================
  notification_service:
    build: ./FlutterBackEnd/service/notification-service
    container_name: notification_service
    restart: always
    depends_on:
      - postgres
      - rabbitmq
    env_file:
      - ./FlutterBackEnd/service/notification-service/.env
    environment:
      DATABASE_URL: postgresql://flutter:1234@postgres:5432/nestdb
      RABBITMQ_URL: amqp://flutter:1234@rabbitmq:5672
      JWT_SECRET: hungprovip
    networks:
      - backend_net

  # ==========================
  # 🖥️ Flutter Web App
  # ==========================
  # flutter_web:
  #   build:
  #     context: ./google_classroom
  #     dockerfile: Dockerfile.flutter
  #   container_name: flutter_web
  #   restart: always
  #   depends_on:
  #     - api_gateway
  #   ports:
  #     - "8080:80"
  #   networks:
  #     - backend_net


# ==========================
# 🧱 Shared Network & Volumes
# ==========================
networks:
  backend_net:

volumes:
  flutterbackend_pgdata:
    external: true

