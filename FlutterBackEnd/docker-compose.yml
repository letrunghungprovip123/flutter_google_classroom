version: '3.9'

services:
  # ==========================
  # 🐘 PostgreSQL Database
  # ==========================
  postgres:
    image: postgres:15
    container_name: postgres_db
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: flutter
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: nestdb
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend_net

  # ==========================
  # 🐇 RabbitMQ Message Broker
  # ==========================
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq_broker
    restart: always
    ports:
      - "5672:5672"     # AMQP - services connect
      - "15672:15672"   # Web UI
    environment:
      RABBITMQ_DEFAULT_USER: flutter
      RABBITMQ_DEFAULT_PASS: 1234
    networks:
      - backend_net

